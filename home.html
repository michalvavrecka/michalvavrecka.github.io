<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#101318">
    <title>Domů</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #101318;
            color: #f2f0ea;
            font-family: -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            overflow: hidden;
        }

        #screen {
            height: 100%;
            box-sizing: border-box;
            padding: 12px 16px 8px;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
        }

        #nowline {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: baseline;
            align-items: baseline;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            white-space: nowrap;
            font-size: 20px;
            line-height: 1.1;
            padding-bottom: 8px;
            border-bottom: 1px solid #2c333c;
        }

        #clock, #temp, #wind, #feel { margin-left: 8px; }
        #date { color: #d5dbe3; }
        #clock { font-size: 1.35em; font-weight: bold; letter-spacing: -0.5px; }
        #temp { font-size: 1.55em; font-weight: bold; color: #f5b942; letter-spacing: -0.6px; }
        #wind, #feel { color: #c5cad1; }

        #forecast {
            padding: 8px 0 6px;
            border-bottom: 1px solid #2c333c;
        }

        #days {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-align-items: flex-start;
            align-items: flex-start;
        }

        .day { width: 25%; padding-right: 6px; box-sizing: border-box; }

        .d-name {
            font-size: 13px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #8e96a1;
        }

        .d-temps {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: baseline;
            align-items: baseline;
            margin-top: 1px;
        }

        .d-max { font-size: 28px; font-weight: bold; line-height: 1; }
        .d-min { margin-left: 5px; font-size: 16px; color: #8e96a1; }

        .d-cond {
            margin-top: 2px;
            font-size: 13px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #c5cad1;
        }

        #graph {
            -webkit-flex: 1 1 auto;
            flex: 1 1 auto;
            min-height: 78px;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            padding-top: 6px;
        }

        .label {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-align-items: baseline;
            align-items: baseline;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8e96a1;
            margin-bottom: 2px;
        }

        .legend { letter-spacing: 0; text-transform: none; font-size: 13px; }

        .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 0 3px 0 8px;
            vertical-align: -1px;
        }

        .swatch.temp { background: #f5b942; }
        .swatch.rain { background: #5aa7ea; }
        .swatch.wind { background: #3ecf8e; }

        #chart-box {
            position: relative;
            -webkit-flex: 1 1 auto;
            flex: 1 1 auto;
            min-height: 0;
        }

        #chart {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #agenda {
            -webkit-flex: 0 1 auto;
            flex: 0 1 auto;
            border-top: 1px solid #2c333c;
            padding-top: 6px;
            margin-top: 4px;
        }

        #events {
            max-height: 108px;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .ev {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: baseline;
            align-items: baseline;
            font-size: 16px;
            line-height: 1.35;
        }

        .ev.past { color: #8e96a1; }
        .ev.past .ev-time { color: #8e96a1; }

        .ev-time {
            width: 78px;
            -webkit-flex: 0 0 78px;
            flex: 0 0 78px;
            color: #f5b942;
            font-weight: bold;
        }

        .ev-title {
            margin-left: 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #agenda-msg {
            font-size: 16px;
            color: #8e96a1;
            line-height: 1.35;
        }

        #signin {
            margin: 2px 0 4px;
            padding: 4px 10px;
            background: #1c2430;
            color: #f2f0ea;
            border: 1px solid #3a4452;
            border-radius: 8px;
            font-size: 15px;
        }

        #trips {
            -webkit-flex: 0 0 auto;
            flex: 0 0 auto;
            border-top: 1px solid #2c333c;
            margin-top: 6px;
            padding-top: 4px;
        }

        .trow {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            line-height: 1.15;
            padding: 1px 0;
        }

        .tname {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            min-width: 0;
        }

        .badge {
            display: inline-block;
            min-width: 42px;
            padding: 1px 7px 2px;
            background: #1f7a45;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
            border-radius: 6px;
        }

        .badge.train { background: #1d4e89; min-width: 52px; }
        .dir { margin-left: 8px; font-size: 16px; color: #c5cad1; }

        .twhen {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: -0.4px;
            margin-left: 8px;
        }

        .car-name { font-size: 18px; color: #d5dbe3; }
        .car .twhen { color: #f5b942; font-size: 24px; }

        #trips .car:first-of-type {
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px solid #2c333c;
        }
    </style>
</head>
<body>
    <div id="screen">
        <div id="nowline">
            <span id="date">načítám…</span>
            <span id="clock">--:--</span>
            <span id="temp">–°</span>
            <span id="wind">vítr –</span>
            <span id="feel">pocitově –°</span>
        </div>

        <section id="forecast">
            <div id="days">
                <div class="day">
                    <div class="d-name" id="n0">Dnes</div>
                    <div class="d-temps"><span class="d-max" id="a0">–°</span><span class="d-min" id="b0"></span></div>
                    <div class="d-cond" id="c0"></div>
                </div>
                <div class="day">
                    <div class="d-name" id="n1">Zítra</div>
                    <div class="d-temps"><span class="d-max" id="a1">–°</span><span class="d-min" id="b1"></span></div>
                    <div class="d-cond" id="c1"></div>
                </div>
                <div class="day">
                    <div class="d-name" id="n2">–</div>
                    <div class="d-temps"><span class="d-max" id="a2">–°</span><span class="d-min" id="b2"></span></div>
                    <div class="d-cond" id="c2"></div>
                </div>
                <div class="day">
                    <div class="d-name" id="n3">–</div>
                    <div class="d-temps"><span class="d-max" id="a3">–°</span><span class="d-min" id="b3"></span></div>
                    <div class="d-cond" id="c3"></div>
                </div>
            </div>
        </section>

        <section id="graph">
            <div class="label">
                <span>24 hodin</span>
                <span class="legend"><i class="swatch temp"></i>°C<i class="swatch rain"></i>mm<i class="swatch wind"></i>km/h</span>
            </div>
            <div id="chart-box"><canvas id="chart"></canvas></div>
        </section>

        <section id="agenda">
            <div class="label"><span>Kalendář</span><span>dnes</span></div>
            <button id="signin" type="button" style="display:none">Přihlásit Google kalendář</button>
            <div id="agenda-msg">načítám kalendář…</div>
            <div id="events"></div>
        </section>

        <section id="trips">
            <div class="trow">
                <div class="tname"><span class="badge">429</span></div>
                <div class="twhen" id="d429">–:–</div>
            </div>
            <div class="trow">
                <div class="tname"><span class="badge">386</span><span class="dir">Praha</span></div>
                <div class="twhen" id="d386">–:–</div>
            </div>
            <div class="trow">
                <div class="tname"><span class="badge">365</span><span class="dir">Praha</span></div>
                <div class="twhen" id="d365">–:–</div>
            </div>
            <div class="trow">
                <div class="tname"><span class="badge train">Vlak</span><span class="dir">Praha</span></div>
                <div class="twhen" id="dtrain">–:–</div>
            </div>
            <div class="trow car">
                <div class="car-name">U Pekáren 1</div>
                <div class="twhen" id="car0">–</div>
            </div>
            <div class="trow car">
                <div class="car-name">Apolinářská</div>
                <div class="twhen" id="car1">–</div>
            </div>
            <div class="trow car">
                <div class="car-name">Vítězné nám.</div>
                <div class="twhen" id="car2">–</div>
            </div>
        </section>
    </div>

    <script>
        var GOOGLE_CLIENT_ID = '';
        var GOOGLE_MAPS_KEY = '';
        var MAPY_API_KEY = '';

        var HOME_LAT = 50.08552;
        var HOME_LON = 14.13378;
        var HOSTIVICE_STOP = 'cz-CZPTT_czptt:stop:CZ:53656';
        var CARS = [
            { id: 'car0', lat: 50.0557292, lon: 14.5388112 },
            { id: 'car1', lat: 50.0713608, lon: 14.4256625 },
            { id: 'car2', lat: 50.1004997, lon: 14.3954986 }
        ];
        var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=50.08552&longitude=14.13378&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Europe%2FPrague&forecast_days=4&wind_speed_unit=kmh';

        var state = {
            boot: 0,
            lastH: 0,
            hours: null,
            weatherFailed: false,
            events: null,
            calendarToken: '',
            tokenClient: null,
            calendarReady: false
        };

        var DAYS = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
        var MONTHS = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];

        function pad2(n) {
            n = Math.floor(n);
            return (n < 10 ? '0' : '') + n;
        }

        function setText(id, value) {
            var node = document.getElementById(id);
            var text = value == null ? '' : String(value);
            if (node && node.textContent !== text) node.textContent = text;
        }

        function fmtTime(d) {
            return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        }

        function dayKey(d) {
            return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
        }

        function startOfDay(d) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate());
        }

        function weatherText(code) {
            var map = {
                0: 'Jasno', 1: 'Skoro jasno', 2: 'Polojasno', 3: 'Zataženo',
                45: 'Mlha', 48: 'Mlha',
                51: 'Mrholení', 53: 'Mrholení', 55: 'Mrholení',
                56: 'Mrznoucí mrholení', 57: 'Mrznoucí mrholení',
                61: 'Slabý déšť', 63: 'Déšť', 65: 'Silný déšť',
                66: 'Mrznoucí déšť', 67: 'Mrznoucí déšť',
                71: 'Slabé sněžení', 73: 'Sníh', 75: 'Silné sněžení', 77: 'Sněhová zrna',
                80: 'Přeháňky', 81: 'Přeháňky', 82: 'Silné přeháňky',
                85: 'Sněhové přeháňky', 86: 'Sněhové přeháňky',
                95: 'Bouřka', 96: 'Bouřka s kroupami', 99: 'Bouřka s kroupami'
            };
            if (map[code] != null) return map[code];
            return 'Počasí';
        }

        function fmtMm(n) {
            if (n == null || isNaN(n) || n < 0.05) return '';
            var text = n < 10 ? n.toFixed(1) : String(Math.round(n));
            return text.replace('.', ',') + ' mm';
        }

        function hasPraha(ev) {
            var head = ev.headsign || '';
            var to = ev.tripTo && ev.tripTo.name ? ev.tripTo.name : '';
            return head.indexOf('Praha') !== -1 || to.indexOf('Praha') !== -1;
        }

        function getJSON(url, ok, err) {
            var xhr = new XMLHttpRequest();
            var finished = false;
            function finish(success, payload) {
                if (finished) return;
                finished = true;
                if (success) ok(payload);
                else if (err) err(payload);
            }
            xhr.open('GET', url, true);
            try { xhr.timeout = 18000; } catch (e) {}
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                    try { finish(true, JSON.parse(xhr.responseText)); }
                    catch (ex) { finish(false, ex); }
                } else {
                    finish(false, new Error('http'));
                }
            };
            xhr.onerror = function () { finish(false, new Error('network')); };
            xhr.ontimeout = function () { finish(false, new Error('timeout')); };
            xhr.send(null);
        }

        function sendJSON(method, url, body, headers, ok, err) {
            var xhr = new XMLHttpRequest();
            var finished = false;
            function finish(success, payload) {
                if (finished) return;
                finished = true;
                if (success) ok(payload);
                else if (err) err(payload);
            }
            xhr.open(method, url, true);
            try { xhr.timeout = 18000; } catch (e) {}
            if (headers) {
                for (var k in headers) {
                    if (headers.hasOwnProperty(k)) xhr.setRequestHeader(k, headers[k]);
                }
            }
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                    try { finish(true, JSON.parse(xhr.responseText)); }
                    catch (ex) { finish(false, ex); }
                } else {
                    finish(false, new Error('http'));
                }
            };
            xhr.onerror = function () { finish(false, new Error('network')); };
            xhr.ontimeout = function () { finish(false, new Error('timeout')); };
            xhr.send(body);
        }

        function fitNowline() {
            var row = document.getElementById('nowline');
            if (!row) return;
            var size = 22;
            row.style.fontSize = size + 'px';
            var guard = 0;
            while (size > 12 && row.scrollWidth > row.clientWidth + 1 && guard < 16) {
                size -= 1;
                row.style.fontSize = size + 'px';
                guard += 1;
            }
        }

        function fit() {
            var h = window.innerHeight || document.documentElement.clientHeight || 1024;
            state.lastH = h;
            document.documentElement.style.height = h + 'px';
            document.body.style.height = h + 'px';
            var events = document.getElementById('events');
            if (events) events.style.maxHeight = Math.max(72, Math.round(h * 0.16)) + 'px';
            fitNowline();
            drawChart();
        }

        function renderClock(now) {
            setText('clock', fmtTime(now));
            setText('date', DAYS[now.getDay()] + ' ' + now.getDate() + '. ' + MONTHS[now.getMonth()]);
            fitNowline();
        }

        function renderWeather() {
            var data = state.weather;
            if (!data || !data.current) return;
            var cur = data.current;
            var temp = Math.round(cur.temperature_2m);
            var feel = Math.round(cur.apparent_temperature);
            var wind = Math.round(cur.wind_speed_10m);
            setText('temp', temp + '°');
            setText('wind', 'vítr ' + wind + ' km/h');
            setText('feel', 'pocitově ' + feel + '°');
            fitNowline();

            var daily = data.daily;
            if (!daily || !daily.time) return;
            var i, label, parts, dt, detail, mm;
            for (i = 0; i < 4; i++) {
                if (!daily.time[i]) continue;
                if (i === 0) label = 'Dnes';
                else if (i === 1) label = 'Zítra';
                else {
                    parts = daily.time[i].split('-');
                    dt = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                    label = DAYS[dt.getDay()];
                }
                mm = daily.precipitation_sum[i];
                detail = weatherText(daily.weather_code[i]);
                if (mm >= 0.5) {
                    var extra = fmtMm(mm);
                    if (extra) detail += ' ' + extra;
                }
                setText('n' + i, label);
                setText('a' + i, Math.round(daily.temperature_2m_max[i]) + '°');
                setText('b' + i, Math.round(daily.temperature_2m_min[i]) + '°');
                setText('c' + i, detail);
            }
        }

        function drawChart() {
            var canvas = document.getElementById('chart');
            var box = document.getElementById('chart-box');
            if (!canvas || !box) return;
            var cssW = box.clientWidth;
            var cssH = box.clientHeight;
            if (cssW < 20 || cssH < 20) return;
            var dpr = window.devicePixelRatio || 1;
            if (dpr > 2) dpr = 2;
            var bw = Math.round(cssW * dpr);
            var bh = Math.round(cssH * dpr);
            if (canvas.width !== bw) canvas.width = bw;
            if (canvas.height !== bh) canvas.height = bh;
            var ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);

            var hours = state.hours;
            ctx.font = '13px Helvetica, Arial, sans-serif';
            if (!hours || !hours.length) {
                ctx.fillStyle = '#8e96a1';
                ctx.textBaseline = 'top';
                ctx.fillText(state.weatherFailed ? 'Graf se nepodařilo načíst' : 'Načítám graf…', 4, 8);
                return;
            }

            var left = 36;
            var right = 32;
            var top = 6;
            var bottom = cssH - 18;
            var plotW = cssW - left - right;
            var plotH = bottom - top;
            if (plotW < 20 || plotH < 20) return;

            var tmin = hours[0].temp;
            var tmax = tmin;
            var pmax = 0;
            var wmax = 0;
            var i, h;
            for (i = 0; i < hours.length; i++) {
                h = hours[i];
                if (h.temp < tmin) tmin = h.temp;
                if (h.temp > tmax) tmax = h.temp;
                if (h.prec > pmax) pmax = h.prec;
                if (h.wind > wmax) wmax = h.wind;
            }
            tmin = Math.floor(tmin) - 1;
            tmax = Math.ceil(tmax) + 1;
            if (tmax <= tmin) tmax = tmin + 4;
            if (pmax <= 1) pmax = 1;
            else pmax = Math.ceil(pmax);
            wmax = Math.max(10, Math.ceil(wmax / 5) * 5);

            function xAt(index) {
                return left + ((index + 0.5) / hours.length) * plotW;
            }
            function yT(v) {
                return top + (tmax - v) / (tmax - tmin) * plotH;
            }
            function yP(v) {
                return bottom - (v / pmax) * plotH;
            }
            function yW(v) {
                return bottom - (v / wmax) * plotH;
            }

            ctx.textBaseline = 'middle';
            ctx.lineWidth = 1;
            var steps = 3;
            var g, val, y;
            for (g = 0; g <= steps; g++) {
                val = tmin + (tmax - tmin) * (g / steps);
                y = yT(val);
                ctx.strokeStyle = '#2a313b';
                ctx.beginPath();
                ctx.moveTo(left, Math.round(y) + 0.5);
                ctx.lineTo(cssW - right, Math.round(y) + 0.5);
                ctx.stroke();
                ctx.fillStyle = '#8e96a1';
                ctx.textAlign = 'right';
                ctx.fillText(Math.round(val) + '°', left - 4, y);
            }

            ctx.textAlign = 'left';
            ctx.fillStyle = '#3ecf8e';
            ctx.fillText(String(Math.round(wmax)), cssW - right + 4, yW(wmax));
            ctx.fillText('0', cssW - right + 4, bottom);

            var slot = plotW / hours.length;
            var barW = Math.max(2, slot * 0.45);
            for (i = 0; i < hours.length; i++) {
                h = hours[i];
                if (!h.prec) continue;
                var x = xAt(i) - barW / 2;
                var yb = yP(h.prec);
                ctx.fillStyle = 'rgba(90, 167, 234, 0.9)';
                ctx.fillRect(x, yb, barW, Math.max(0, bottom - yb));
            }

            ctx.beginPath();
            ctx.strokeStyle = '#3ecf8e';
            ctx.lineWidth = 1.6;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            for (i = 0; i < hours.length; i++) {
                if (i === 0) ctx.moveTo(xAt(i), yW(hours[i].wind));
                else ctx.lineTo(xAt(i), yW(hours[i].wind));
            }
            ctx.stroke();

            if (hours.length) {
                ctx.beginPath();
                ctx.moveTo(xAt(0), yT(hours[0].temp));
                for (i = 1; i < hours.length; i++) ctx.lineTo(xAt(i), yT(hours[i].temp));
                ctx.lineTo(xAt(hours.length - 1), bottom);
                ctx.lineTo(xAt(0), bottom);
                ctx.closePath();
                ctx.fillStyle = 'rgba(245, 185, 66, 0.12)';
                ctx.fill();
            }

            ctx.beginPath();
            ctx.strokeStyle = '#f5b942';
            ctx.lineWidth = 2.4;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            for (i = 0; i < hours.length; i++) {
                if (i === 0) ctx.moveTo(xAt(i), yT(hours[i].temp));
                else ctx.lineTo(xAt(i), yT(hours[i].temp));
            }
            ctx.stroke();

            ctx.fillStyle = '#8e96a1';
            ctx.textBaseline = 'top';
            ctx.font = '12px Helvetica, Arial, sans-serif';
            for (i = 0; i < hours.length; i += 3) {
                ctx.textAlign = i === 0 ? 'left' : 'center';
                ctx.fillText(String(hours[i].hour), xAt(i), bottom + 3);
            }

            var now = new Date();
            var hoursFromStart = (now.getTime() - hours[0].ts) / 3600000;
            if (hoursFromStart >= 0 && hoursFromStart <= hours.length) {
                var nx = xAt(hoursFromStart - 0.5);
                if (nx < left) nx = left;
                if (nx > left + plotW) nx = left + plotW;
                ctx.strokeStyle = '#f2f0ea';
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(nx, top);
                ctx.lineTo(nx, bottom);
                ctx.stroke();
                var i0 = Math.floor(hoursFromStart);
                if (i0 < 0) i0 = 0;
                if (i0 >= hours.length - 1) i0 = hours.length - 2;
                if (i0 < 0) i0 = 0;
                var mix = hoursFromStart - i0;
                if (mix < 0) mix = 0;
                if (mix > 1) mix = 1;
                var curTemp = hours[i0].temp;
                if (hours[i0 + 1]) curTemp = hours[i0].temp + (hours[i0 + 1].temp - hours[i0].temp) * mix;
                ctx.beginPath();
                ctx.fillStyle = '#f5b942';
                ctx.arc(nx, yT(curTemp), 3.5, 0, Math.PI * 2, false);
                ctx.fill();
            }
        }

        function loadWeather() {
            getJSON(WEATHER_URL, function (data) {
                state.weather = data;
                state.weatherFailed = false;
                var times = data.hourly && data.hourly.time ? data.hourly.time : [];
                var temps = data.hourly.temperature_2m || [];
                var precs = data.hourly.precipitation || [];
                var winds = data.hourly.wind_speed_10m || [];
                var now = new Date();
                var nowKey = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()) + 'T' + pad2(now.getHours());
                var start = 0;
                var i, parts, ymd, hm, dt;
                for (i = 0; i < times.length; i++) {
                    if (times[i].indexOf(nowKey) === 0) { start = i; break; }
                }
                var out = [];
                for (i = start; i < times.length && out.length < 24; i++) {
                    parts = times[i].split('T');
                    ymd = parts[0].split('-');
                    hm = parts[1].split(':');
                    dt = new Date(parseInt(ymd[0], 10), parseInt(ymd[1], 10) - 1, parseInt(ymd[2], 10), parseInt(hm[0], 10), parseInt(hm[1], 10) || 0);
                    out.push({
                        ts: dt.getTime(),
                        hour: dt.getHours(),
                        temp: temps[i],
                        prec: precs[i] || 0,
                        wind: winds[i] || 0
                    });
                }
                state.hours = out;
                renderWeather();
                drawChart();
            }, function () {
                state.weatherFailed = !state.weather;
                if (!state.weather) {
                    setText('temp', '–°');
                    setText('wind', 'vítr –');
                    setText('feel', 'počasí nedostupné');
                    drawChart();
                }
            });
        }

        function nextOf(events, match) {
            var now = Date.now();
            var best = null;
            var i, ev, dep, t;
            for (i = 0; i < events.length; i++) {
                ev = events[i];
                if (!ev || ev.cancelled || ev.tripCancelled) continue;
                if (!match(ev)) continue;
                dep = ev.place && ev.place.departure;
                if (!dep) continue;
                t = new Date(dep).getTime();
                if (isNaN(t) || t < now - 30000) continue;
                if (!best || t < best) best = t;
            }
            return best;
        }

        function fmtDep(ms, now) {
            if (ms === undefined) return '–:–';
            if (ms === null) return 'nejede';
            var date = new Date(ms);
            var text = fmtTime(date);
            var diff = Math.round((startOfDay(date).getTime() - startOfDay(now).getTime()) / 86400000);
            if (diff === 1) text += ' zítra';
            else if (diff > 1) text += ' ' + DAYS[date.getDay()];
            return text;
        }

        function renderDeps(now) {
            setText('d429', fmtDep(state.dep429, now));
            setText('d386', fmtDep(state.dep386, now));
            setText('d365', fmtDep(state.dep365, now));
            setText('dtrain', fmtDep(state.depTrain, now));
        }

        function loadTransit() {
            var busUrl = 'https://api.transitous.org/api/v1/stoptimes?center=' + HOME_LAT + ',' + HOME_LON +
                '&radius=300&exactRadius=true&n=40&window=54000';
            var trainUrl = 'https://api.transitous.org/api/v1/stoptimes?stopId=' + encodeURIComponent(HOSTIVICE_STOP) +
                '&n=30&window=64800';
            var pending = 2;
            var buses = null;
            var trains = null;
            function done() {
                pending -= 1;
                if (pending > 0) return;
                var bev = buses && buses.stopTimes ? buses.stopTimes : [];
                var tev = trains && trains.stopTimes ? trains.stopTimes : [];
                if (buses) {
                    state.dep429 = nextOf(bev, function (ev) { return ev.routeShortName === '429'; });
                    state.dep386 = nextOf(bev, function (ev) { return ev.routeShortName === '386' && hasPraha(ev); });
                    state.dep365 = nextOf(bev, function (ev) { return ev.routeShortName === '365' && hasPraha(ev); });
                }
                if (trains) {
                    state.depTrain = nextOf(tev, function (ev) {
                        var mode = ev.mode || '';
                        return mode.indexOf('RAIL') !== -1 && hasPraha(ev);
                    });
                }
                renderDeps(new Date());
            }
            getJSON(busUrl, function (data) { buses = data; done(); }, function () { done(); });
            getJSON(trainUrl, function (data) { trains = data; done(); }, function () { done(); });
        }

        function setCar(index, seconds) {
            if (seconds == null || isNaN(seconds)) {
                setText(CARS[index].id, '–');
                return;
            }
            var min = Math.max(1, Math.round(seconds / 60));
            setText(CARS[index].id, min + ' min');
        }

        function loadOsrm(index) {
            var dest = CARS[index];
            var url = 'https://router.project-osrm.org/route/v1/driving/' +
                HOME_LON + ',' + HOME_LAT + ';' + dest.lon + ',' + dest.lat + '?overview=false';
            getJSON(url, function (data) {
                var route = data.routes && data.routes.length ? data.routes[0] : null;
                setCar(index, route ? route.duration : null);
            }, function () {
                setText(dest.id, '–');
            });
        }

        function loadMapy(index) {
            var dest = CARS[index];
            var url = 'https://api.mapy.com/v1/routing/route?routeType=car_fast_traffic&lang=cs&start=' +
                HOME_LON + ',' + HOME_LAT + '&end=' + dest.lon + ',' + dest.lat + '&apikey=' + encodeURIComponent(MAPY_API_KEY);
            getJSON(url, function (data) {
                if (data && data.duration != null) setCar(index, data.duration);
                else loadOsrm(index);
            }, function () { loadOsrm(index); });
        }

        function loadWaze(index) {
            var dest = CARS[index];
            var body = JSON.stringify({
                from: { y: HOME_LAT, x: HOME_LON },
                to: { y: dest.lat, x: dest.lon },
                nPaths: 2,
                useCase: 'LIVEMAP_PLANNING',
                interval: 15,
                arriveAt: true
            });
            sendJSON('POST', 'https://www.waze.com/live-map/api/user-drive?geo_env=row', body, {
                'Content-Type': 'application/json'
            }, function (data) {
                var alts = data && data.alternatives ? data.alternatives : [];
                var best = null;
                var i, sec;
                for (i = 0; i < alts.length; i++) {
                    sec = alts[i].response && alts[i].response.totalSeconds;
                    if (sec == null) continue;
                    if (best == null || sec < best) best = sec;
                }
                if (best == null) loadOsrm(index);
                else setCar(index, best);
            }, function () { loadOsrm(index); });
        }

        function loadGoogleTraffic() {
            if (!window.google || !google.maps || !google.maps.DistanceMatrixService) return false;
            var service = new google.maps.DistanceMatrixService();
            var dests = [];
            var i;
            for (i = 0; i < CARS.length; i++) dests.push(new google.maps.LatLng(CARS[i].lat, CARS[i].lon));
            service.getDistanceMatrix({
                origins: [new google.maps.LatLng(HOME_LAT, HOME_LON)],
                destinations: dests,
                travelMode: google.maps.TravelMode.DRIVING,
                drivingOptions: { departureTime: new Date() },
                unitSystem: google.maps.UnitSystem.METRIC
            }, function (response, status) {
                var ok = status === 'OK' && response && response.rows && response.rows[0];
                var elements = ok ? response.rows[0].elements : [];
                var n;
                for (n = 0; n < CARS.length; n++) {
                    var el = elements[n];
                    var traffic = el && (el.duration_in_traffic || el.duration);
                    if (el && el.status === 'OK' && traffic) setCar(n, traffic.value);
                    else loadWaze(n);
                }
            });
            return true;
        }

        function ensureGoogleMaps(cb) {
            if (window.google && google.maps && google.maps.DistanceMatrixService) {
                cb();
                return;
            }
            if (state.mapsLoading) return;
            state.mapsLoading = true;
            var s = document.createElement('script');
            s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GOOGLE_MAPS_KEY);
            s.onload = function () { state.mapsLoading = false; cb(); };
            s.onerror = function () {
                state.mapsLoading = false;
                var i;
                for (i = 0; i < CARS.length; i++) loadWaze(i);
            };
            document.body.appendChild(s);
        }

        function loadCars() {
            var i;
            if (GOOGLE_MAPS_KEY) {
                ensureGoogleMaps(function () {
                    if (!loadGoogleTraffic()) {
                        for (i = 0; i < CARS.length; i++) loadWaze(i);
                    }
                });
                return;
            }
            if (MAPY_API_KEY) {
                for (i = 0; i < CARS.length; i++) loadMapy(i);
                return;
            }
            for (i = 0; i < CARS.length; i++) loadWaze(i);
        }

        function setAgendaMessage(text) {
            var node = document.getElementById('agenda-msg');
            if (!node) return;
            node.style.display = text ? 'block' : 'none';
            node.textContent = text || '';
        }

        function showSignIn(show) {
            var button = document.getElementById('signin');
            if (button) button.style.display = show ? 'inline-block' : 'none';
        }

        function eventStart(ev) {
            var s = ev.start || {};
            if (s.dateTime) return new Date(s.dateTime).getTime();
            return null;
        }

        function eventEnd(ev) {
            var e = ev.end || {};
            if (e.dateTime) return new Date(e.dateTime).getTime();
            if (e.date) {
                var p = e.date.split('-');
                return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getTime();
            }
            return null;
        }

        function eventSortKey(ev) {
            var s = ev.start || {};
            if (s.date && !s.dateTime) return 0;
            var t = eventStart(ev);
            return t == null ? 1 : t;
        }

        function declined(ev) {
            var list = ev.attendees || [];
            var i;
            for (i = 0; i < list.length; i++) {
                if (list[i].self && list[i].responseStatus === 'declined') return true;
            }
            return false;
        }

        function renderEvents() {
            var box = document.getElementById('events');
            if (!box) return;
            while (box.firstChild) box.removeChild(box.firstChild);
            var list = state.events || [];
            if (!list.length) {
                setAgendaMessage(state.calendarReady ? 'dnes nic' : '');
                return;
            }
            setAgendaMessage('');
            var now = Date.now();
            var i, ev, row, timeNode, titleNode, endMs, when;
            for (i = 0; i < list.length; i++) {
                ev = list[i];
                row = document.createElement('div');
                row.className = 'ev';
                endMs = eventEnd(ev);
                if (endMs != null && endMs < now && eventStart(ev) != null) row.className += ' past';
                timeNode = document.createElement('div');
                timeNode.className = 'ev-time';
                when = eventStart(ev);
                timeNode.textContent = when == null ? 'celý den' : fmtTime(new Date(when));
                titleNode = document.createElement('div');
                titleNode.className = 'ev-title';
                titleNode.textContent = ev.summary || '(bez názvu)';
                row.appendChild(timeNode);
                row.appendChild(titleNode);
                box.appendChild(row);
            }
        }

        function authGet(url, ok, err) {
            sendJSON('GET', url, null, { 'Authorization': 'Bearer ' + state.calendarToken }, ok, err);
        }

        function loadEvents() {
            if (!state.calendarToken) return;
            var now = new Date();
            var start = startOfDay(now);
            var end = new Date(start.getTime() + 86400000);
            var timeMin = encodeURIComponent(start.toISOString());
            var timeMax = encodeURIComponent(end.toISOString());
            authGet('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader&maxResults=20', function (data) {
                var items = data && data.items ? data.items : [];
                var ids = [];
                var i;
                for (i = 0; i < items.length; i++) {
                    if (items[i].selected && items[i].id) ids.push(items[i].id);
                    if (ids.length >= 8) break;
                }
                if (!ids.length) ids.push('primary');
                fetchCalendars(ids, timeMin, timeMax);
            }, function () {
                fetchCalendars(['primary'], timeMin, timeMax);
            });
        }

        function fetchCalendars(ids, timeMin, timeMax) {
            var pending = ids.length;
            var merged = [];
            var seen = {};
            var failed = 0;
            function add(data) {
                var items = data && data.items ? data.items : [];
                var i, ev;
                for (i = 0; i < items.length; i++) {
                    ev = items[i];
                    if (!ev || ev.status === 'cancelled' || declined(ev)) continue;
                    if (ev.id && seen[ev.id]) continue;
                    if (ev.id) seen[ev.id] = 1;
                    merged.push(ev);
                }
            }
            function finish() {
                pending -= 1;
                if (pending > 0) return;
                merged.sort(function (a, b) { return eventSortKey(a) - eventSortKey(b); });
                state.events = merged;
                state.calendarReady = true;
                if (!merged.length && failed === ids.length) setAgendaMessage('Kalendář se nepodařilo načíst');
                renderEvents();
            }
            var n;
            for (n = 0; n < ids.length; n++) {
                (function (id) {
                    var url = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(id) +
                        '/events?singleEvents=true&orderBy=startTime&timeMin=' + timeMin + '&timeMax=' + timeMax + '&maxResults=20';
                    authGet(url, function (data) { add(data); finish(); }, function () { failed += 1; finish(); });
                })(ids[n]);
            }
        }

        function onCalendarToken(resp) {
            if (resp && resp.access_token) {
                state.calendarToken = resp.access_token;
                showSignIn(false);
                setAgendaMessage('načítám kalendář…');
                loadEvents();
                return;
            }
            showSignIn(true);
            if (!state.events) setAgendaMessage('Kalendář není přihlášen');
        }

        function startTokenClient() {
            if (!window.google || !google.accounts || !google.accounts.oauth2) return;
            state.tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/calendar.readonly',
                callback: onCalendarToken,
                error_callback: function () {
                    showSignIn(true);
                    if (!state.calendarToken) setAgendaMessage('Kalendář není přihlášen');
                }
            });
            state.tokenClient.requestAccessToken({ prompt: '' });
        }

        function initCalendar() {
            var button = document.getElementById('signin');
            if (button) {
                button.onclick = function () {
                    if (state.tokenClient) state.tokenClient.requestAccessToken({ prompt: 'select_account' });
                };
            }
            if (!GOOGLE_CLIENT_ID) {
                showSignIn(false);
                setAgendaMessage('Kalendář Google není připojen');
                return;
            }
            var s = document.createElement('script');
            s.src = 'https://accounts.google.com/gsi/client';
            s.onload = startTokenClient;
            s.onerror = function () { setAgendaMessage('Kalendář se nepodařilo načíst'); };
            document.body.appendChild(s);
        }

        function tick() {
            var now = new Date();
            var h = window.innerHeight || 0;
            if (h && h !== state.lastH) fit();
            renderClock(now);
            if (now.getSeconds() === 0) {
                drawChart();
                renderEvents();
                renderDeps(now);
            }
        }

        function wakeup() {
            if (Date.now() - state.boot < 4000) return;
            loadWeather();
            loadTransit();
            loadCars();
            if (state.calendarToken) loadEvents();
            else if (state.tokenClient) state.tokenClient.requestAccessToken({ prompt: '' });
        }

        function init() {
            state.boot = Date.now();
            fit();
            renderClock(new Date());
            loadWeather();
            loadTransit();
            loadCars();
            initCalendar();
            setInterval(tick, 1000);
            setInterval(loadWeather, 10 * 60 * 1000);
            setInterval(loadTransit, 60 * 1000);
            setInterval(loadCars, 3 * 60 * 1000);
            setInterval(function () {
                if (state.calendarToken) loadEvents();
            }, 5 * 60 * 1000);
            window.addEventListener('resize', fit, false);
            window.addEventListener('orientationchange', function () { setTimeout(fit, 300); }, false);
            window.addEventListener('pageshow', wakeup, false);
            document.addEventListener('touchmove', function (e) {
                var node = e.target;
                while (node) {
                    if (node.id === 'events') return;
                    node = node.parentNode;
                }
                e.preventDefault();
            }, false);
            document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, false);
        else init();
    </script>
</body>
</html>
